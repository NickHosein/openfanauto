<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>OpenFanAuto</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
  <link rel="stylesheet" href="css/app.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 13m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M12 17v.01"/><path d="M11 4a4 4 0 0 1 2 0a4 4 0 1 0 -2 0"/><path d="M4 11a4 4 0 0 1 0 2a4 4 0 1 0 0 -2"/><path d="M20 11a4 4 0 0 1 0 2a4 4 0 1 0 0 -2"/></svg>
          OpenFanAuto
        </h1>
        <div class="navbar-nav flex-row order-md-last">
          <span class="nav-item me-3 d-flex align-items-center">
            <span class="status-dot me-2" id="status-dot"></span>
            <span id="status-text" class="text-muted">Connecting...</span>
          </span>
          <div class="dropdown me-2">
            <button class="btn btn-md btn-primary dropdown-toggle" data-bs-toggle="dropdown">
              Set All Fans
            </button>
            <div class="dropdown-menu dropdown-menu-end p-3" style="min-width:220px">
              <label class="form-label small">Set all fans to: <strong id="all-fans-value-label">50%</strong></label>
              <input type="range" class="form-range mb-2" id="all-fans-value" min="0" max="100" value="50" step="1">
              <button class="btn btn-sm btn-primary w-100" id="btn-all-fans-pwm">Apply</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">

          <div class="d-flex flex-wrap mb-3" id="fan-tiles" style="gap:0.5rem"></div>

          <!-- Temperatures -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">Temperatures</h3>
                  <div class="card-actions">
                    <span class="text-muted small" id="temps-updated"></span>
                  </div>
                </div>
                <div class="card-body">
                  <div id="temp-msg" class="mb-2"></div>
                  <div class="row g-3" id="temp-tiles"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Fan Curve Editor -->
          <div class="row mb-3">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h3 class="card-title">Fan Curve Editor</h3>
                  <div class="card-actions">
                    <select class="form-select" id="curve-profile-select" style="width:auto;min-width:160px">
                      <option value="">New Profile</option>
                    </select>
                  </div>
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-lg-8">
                      <div class="row g-3 mb-3">
                        <div class="col-md-6">
                          <label class="form-label">Assign to Fans <small class="text-muted">(click to select)</small></label>
                          <select class="form-select" id="curve-fan-select" multiple size="5"></select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label">Profile Name</label>
                          <input type="text" class="form-control" id="curve-profile-name" placeholder="e.g. QuietMode">
                        </div>
                      </div>
                      <div style="position: relative; height: 350px;">
                        <canvas id="curve-chart"></canvas>
                      </div>
                      <p class="text-muted small mt-2 mb-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12h4l3 8l4 -16l3 8h4"/></svg>
                        Click on the chart to add a new point. Right-click to delete.
                      </p>
                    </div>
                    <div class="col-lg-4">
                      <div class="mb-3">
                        <label class="form-label">Curve Type</label>
                        <select class="form-select" id="curve-type-select">
                          <option value="threshold">Threshold</option>
                          <option value="linear">Linear</option>
                        </select>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Temperature Source</label>
                        <select class="form-select" id="curve-temp-source" multiple size="4">
                        </select>
                      </div>
                      <div class="mb-3">
                        <div class="form-check form-switch">
                          <input class="form-check-input" type="checkbox" id="curve-use-pwm" checked>
                          <label class="form-check-label" for="curve-use-pwm">Use PWM (vs RPM)</label>
                        </div>
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Curve Points <small class="text-muted">— temperature → fan speed pairs</small></label>
                        <div id="curve-points-table"></div>
                      </div>
                      <div class="d-flex gap-2">
                        <button class="btn btn-primary flex-fill" id="btn-save-curve">Save Profile</button>
                        <button class="btn btn-outline-secondary" id="btn-clear-curve">Clear</button>
                        <button class="btn btn-outline-danger" id="btn-delete-curve" title="Delete selected profile">
                          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>
                        </button>
                      </div>
                      <div id="assign-msg" class="mt-3 pt-3 border-top" style="display:none"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
