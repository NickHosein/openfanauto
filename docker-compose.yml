# OpenFanAuto — local development (mock hardware)
version: "3.8"

services:
  openfanauto:
    build: .
    container_name: openfanauto
    ports:
      - "3211:3211"
    environment:
      - MOCK_HARDWARE=true
      - OPENFANCOMPORT=/dev/null
      - OPENFAN_AUTO_ENABLED=false
      - OPENFAN_DEBUG_UART=false
      - OPENFAN_PORT=3211
      - OPENFAN_POLL_INTERVAL=10
      - OPENFAN_RELOAD_PROFILES=true
    volumes:
      - ./config:/config:ro
